<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calendrier de l'avent virtuel pour un petit cercle de proches."
    />
    <title>Calendrier de l'Avent</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Calendrier de l'Avent</p>
        <h1>Petit cercle de Noël</h1>
      </header>

      <div id="lock-message" class="lock-message" aria-live="polite"></div>

      <main class="calendar-scene" aria-label="Calendrier de l'avent">
        <div id="calendar" class="calendar-grid" aria-live="polite"></div>
      </main>
    </div>

    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button type="button" class="modal-close" aria-label="Fermer la fenêtre">
          ×
        </button>
        <div id="modal-content" class="modal-content"></div>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
