<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calendrier de l'avent virtuel pour un petit cercle de proches."
    />
    <title>Calendrier de l'Avent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <h1>Calendrier de l'avant</h1>
      </header>

      <div id="lock-message" class="lock-message" aria-live="polite"></div>

      <main class="calendar-scene" aria-label="Calendrier de l'avent">
        <button id="previous-case" class="carousel-nav" type="button" aria-label="Case précédente" title="Case précédente">‹</button>
        <div class="calendar-slide">
          <div id="calendar" class="calendar-display" aria-live="polite"></div>
          <p id="case-position" class="case-position" aria-live="polite"></p>
        </div>
        <button id="next-case" class="carousel-nav" type="button" aria-label="Case suivante" title="Case suivante">›</button>
      </main>
    </div>

    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button type="button" class="modal-close" aria-label="Fermer la fenêtre">
          
        </button>
        <div id="modal-content" class="modal-content"></div>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
